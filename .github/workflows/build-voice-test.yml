name: Build Floor TV Voice Test

on:
  push:
    branches: [ main ]
    paths:
      - 'voice-test.html'
      - 'settings.gradle'
      - 'build.gradle'
      - 'app/**'
      - '.github/workflows/build-voice-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk The-Floor-TV.apk
      - name: Publish stable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete floor-tv-current --yes --cleanup-tag 2>/dev/null || true
          gh release delete voice-test-v0.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create floor-tv-current The-Floor-TV.apk \
            --title "The Floor TV v0.1.1 — Remote Mic Hotfix" \
            --notes "Jestine vs Justin 1v1 Android TV hardware test. Fixes the start overlay remaining over an active duel and stabilizes repeated native speech-recognizer restarts. 45-second clocks, spoken answers and spoken Pass with 3-second penalty. Stable release URL retained for Downloader code 6913823."
