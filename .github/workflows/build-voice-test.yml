name: Build Floor TV Voice Test

on:
  push:
    branches: [ main ]
    paths:
      - 'voice-test.html'
      - 'settings.gradle'
      - 'build.gradle'
      - 'app/**'
      - '.github/workflows/build-voice-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floor-tv-current-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: floor-tv-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk The-Floor-TV.apk
      - name: Publish stable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete floor-tv-current --yes --cleanup-tag 2>/dev/null || true
          gh release delete voice-test-v0.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create floor-tv-current The-Floor-TV.apk \
            --title "The Floor TV v0.3.0 — Three-Category Voice Test" \
            --notes "Jestine vs Justin Android TV voice stress-test build. Choose Food Photos, Quick Maths, or Fill the Blank. Each category runs a randomized 3-minute voice-driven session; correct answers advance and hand over to the other player, wrong answers keep the prompt live, and spoken Pass skips with a 3-second penalty. Includes native remote-mic diagnostics and persistent signing. Downloader code remains 6913823."
