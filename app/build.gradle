plugins { id 'com.android.application' }

android {
    namespace 'tv.thefloor.voicetest'
    compileSdk 36

    defaultConfig {
        applicationId 'tv.thefloor.voicetest'
        minSdk 23
        targetSdk 36
        versionCode 101
        versionName '0.1.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
